<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17171b">
  <title>Sign in or create an account — Xauhu AI Shop</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f6f2;color:#19191d;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    .panel{width:min(440px,100%);background:#fff;border:1px solid #e7e5df;border-radius:16px;padding:28px;box-shadow:0 18px 50px #19191d0c}.brand{font-size:20px;font-weight:800;letter-spacing:-1px}.brand span{color:#968bdc}.back{display:inline-block;margin:12px 0 22px;color:#686772;font-size:13px;text-decoration:none}.back:hover{text-decoration:underline}h1{font-size:28px;letter-spacing:-1px;margin:0 0 8px}.intro{font-size:13px;color:#707078;margin:0 0 20px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f3f2ee;border-radius:9px;margin-bottom:18px}.tabs button{padding:9px;border:0;border-radius:7px;background:transparent;font:inherit;font-size:13px;font-weight:700;color:#686772;cursor:pointer}.tabs button[aria-selected="true"]{background:white;color:#19191d;box-shadow:0 1px 4px #19191d18}label{display:block;margin:13px 0 5px;font-size:12px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid #dcd9d2;border-radius:8px;font:inherit;font-size:14px}input:focus{outline:2px solid #968bdc;outline-offset:1px}.submit{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#19191d;color:white;font:inherit;font-weight:700;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.message{min-height:20px;margin:12px 0 0;font-size:12px;color:#62616b}.message.error{color:#a12727}.message.success{color:#3f7040}.footnote{font-size:11px;color:#777681;margin-top:18px}.hidden{display:none!important}button:focus-visible,a:focus-visible{outline:3px solid #968bdc;outline-offset:2px}
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">xauhu<span>.ai</span></div>
    <a class="back" href="/">← Back to shop</a>
    <h1 id="heading">Welcome back</h1>
    <p class="intro">Sign in to your customer account or create one to get started.</p>
    <div class="tabs" role="tablist" aria-label="Account access">
      <button id="login-tab" type="button" role="tab" aria-selected="true">Log in</button>
      <button id="signup-tab" type="button" role="tab" aria-selected="false">Sign up</button>
    </div>
    <form id="auth-form" novalidate>
      <div id="name-wrap" class="hidden"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" maxlength="80"></div>
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required aria-describedby="password-help">
      <div class="footnote" id="password-help">Use at least 10 characters.</div>
      <button class="submit" id="submit" type="submit">Log in</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="footnote">Your password is sent over HTTPS to the configured authentication provider. This site does not store your password.</p>
  </main>
  <script>
    const form = document.getElementById('auth-form');
    const loginTab = document.getElementById('login-tab');
    const signupTab = document.getElementById('signup-tab');
    const nameWrap = document.getElementById('name-wrap');
    const nameInput = document.getElementById('name');
    const password = document.getElementById('password');
    const submit = document.getElementById('submit');
    const message = document.getElementById('message');
    let mode = 'login';
    function setMode(next) {
      mode = next;
      const signup = mode === 'signup';
      loginTab.setAttribute('aria-selected', String(!signup));
      signupTab.setAttribute('aria-selected', String(signup));
      nameWrap.classList.toggle('hidden', !signup);
      nameInput.required = signup;
      password.autocomplete = signup ? 'new-password' : 'current-password';
      submit.textContent = signup ? 'Create account' : 'Log in';
      document.getElementById('heading').textContent = signup ? 'Create your account' : 'Welcome back';
      message.textContent = '';
      message.className = 'message';
    }
    loginTab.addEventListener('click', () => setMode('login'));
    signupTab.addEventListener('click', () => setMode('signup'));
    async function checkSession() {
      try {
        const response = await fetch('/api/auth?action=me', {credentials:'same-origin', headers:{Accept:'application/json'}});
        const result = await response.json();
        if (result.user) {
          message.textContent = `You are signed in as ${result.user.email}.`;
          message.className = 'message success';
          submit.textContent = 'Log out';
          submit.type = 'button';
          submit.addEventListener('click', logout, {once:true});
        }
      } catch {}
    }
    async function logout() {
      submit.disabled = true;
      try {
        await fetch('/api/auth', {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});
        message.textContent = 'You have been signed out.';
        message.className = 'message success';
        submit.type = 'submit';
        setMode('login');
      } catch {
        message.textContent = 'Could not sign out. Please try again.';
        message.className = 'message error';
      } finally { submit.disabled = false; }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (submit.type === 'button') return;
      if (!form.reportValidity()) return;
      const data = {action:mode,email:form.elements.email.value.trim(),password:password.value};
      if (mode === 'signup') data.name = nameInput.value.trim();
      submit.disabled = true;
      message.textContent = 'Please wait…';
      message.className = 'message';
      try {
        const response = await fetch('/api/auth', {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data)});
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Could not complete the request.');
        message.textContent = result.message || (result.user ? 'Signed in successfully.' : 'Check your email to confirm your account.');
        message.className = 'message success';
        if (result.user) {
          submit.textContent = 'Log out';
          submit.type = 'button';
          submit.addEventListener('click', logout, {once:true});
        }
      } catch (error) {
        message.textContent = error.message || 'Authentication service is unavailable.';
        message.className = 'message error';
      } finally { submit.disabled = false; }
    });
    checkSession();
  </script>
</body>
</html>
